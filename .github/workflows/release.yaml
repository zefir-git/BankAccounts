name: Release

on:
  release:
    types: [ published ]

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: Set version from release tag
        run: mvn -B versions:set -DnewVersion=${{ github.event.release.tag_name }} -DgenerateBackupPoms=false
        
      - name: Generate test GPG key
        run: |
          cat >keyparams <<'EOF'
          %no-protection
          Key-Type: RSA
          Key-Length: 4096
          Subkey-Type: RSA
          Subkey-Length: 4096
          Name-Real: CI Test
          Name-Email: ci@example.invalid
          Expire-Date: 1d
          %commit
          EOF
          
          gpg --batch --generate-key keyparams

      - name: Build and package Maven project
        run: mvn -B clean package verify --file pom.xml

      - name: Upload to release
        uses: cloudnode-pro/release-upload-asset@v1
        with:
          gh-token: ${{ github.token }}
          files: target/bankaccounts-${{ github.event.release.tag_name }}.jar; type=application/java-archive

      - name: Upload to Modrinth
        uses: cloudnode-pro/modrinth-publish@v2
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: XvJJcQVO
          name: ${{ github.event.release.name == github.event.release.tag_name && format('BankAccounts {0}', github.event.release.name) || github.event.release.name }}
          version: ${{ github.event.release.tag_name }}
          changelog: ${{ github.event.release.body }}
          loaders: paper
          dependencies: |-
            [{
              "project_id": "lKEzGugV",
              "dependency_type": "optional"
            }]
          game-versions: |-
            1.20.x
            1.21.x
          files: |-
            target/bankaccounts-${{ github.event.release.tag_name }}.jar
            target/bankaccounts-${{ github.event.release.tag_name }}.jar.asc
            target/bankaccounts-${{ github.event.release.tag_name }}-sources.jar
            target/bankaccounts-${{ github.event.release.tag_name }}-sources.jar.asc
          file-types: |-
            bankaccounts-${{ github.event.release.tag_name }}.jar.asc=signature
            bankaccounts-${{ github.event.release.tag_name }}-sources.jar=sources-jar
            bankaccounts-${{ github.event.release.tag_name }}-sources.jar.asc=signature
